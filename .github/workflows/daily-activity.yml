name: Daily Activity Log

# Runs once a day at a fixed time and appends a line to activity.md,
# proving the repo is alive without touching any application code.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allows a manual test run from the Actions tab

permissions:
  contents: write # only permission needed: read code, push the log update

concurrency:
  group: daily-activity-log
  cancel-in-progress: false

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append today's entry (skip if already logged today)
        id: log
        run: |
          set -euo pipefail
          TODAY="$(date -u +"%Y-%m-%d")"
          if grep -q "^- ${TODAY} " activity.md; then
            echo "Already logged for ${TODAY}, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIME="$(date -u +"%H:%M:%S UTC")"
          echo "- ${TODAY} ${TIME} — automated daily check-in (run #${GITHUB_RUN_NUMBER})" >> activity.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.log.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: mohattab
          GIT_AUTHOR_EMAIL: mohamedhatab884@gmail.com
          GIT_COMMITTER_NAME: mohattab
          GIT_COMMITTER_EMAIL: mohamedhatab884@gmail.com
        run: |
          set -euo pipefail
          git add activity.md
          git commit -m "chore: daily activity log update ($(date -u +"%Y-%m-%d"))"
          git push origin HEAD:master
