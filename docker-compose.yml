services:
  api:
    build: .
    ports:
      - "3000:3000"
    # The process never needs to gain privileges it did not start with.
    security_opt:
      - no-new-privileges:true
    environment:
      # development by default so `docker compose up` works without Stripe/SMTP;
      # production additionally requires CORS_ORIGIN, Stripe and SMTP (see .env.example).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/recruitment-investment
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a real secret in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_URL: ${APP_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SERVICE: ${SMTP_SERVICE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  mongo:
    image: mongo:7
    # Deliberately not published to the host. This container runs without
    # authentication, so a port mapping would put an open database on the
    # network of whatever machine runs `docker compose up` — it used to be
    # published on every interface. The API reaches it over the compose network
    # by service name, and a developer who needs a shell uses
    # `docker compose exec mongo mongosh`. A real deployment runs an
    # authenticated, network-isolated database (see docs/SECURITY.md).
    volumes:
      - mongo-data:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  uploads:
